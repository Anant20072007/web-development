  function validateForm() {    alert("Validation function called"); 
    var name = document.getElementById("name").value; 
    var password = document.getElementById("password").value; 
    var email = document.getElementById("email").value; 
    var phone = document.getElementById("phone").value; 
    var namePattern = /^[A-Za-z]+$/; 
    if (name.length < 6) {      alert("Name should not be less than 6 characters.");     document.getElementById("name").focus();      return false;    } 
    if (!namePattern.test(name)) {      alert("Name should contain alphabets only.");      document.getElementById("name").focus();      return false;    } 
    if (password.length < 6) {  alert("Password should not be less than 6 characters.");    document.getElementById("password").focus();      return 
false;    } 
var emailPattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/; 
    if (!emailPattern.test(email)) {      alert("Please enter a valid E-mail ID.");     document.getElementById("email").focus();    return false;    } 
    var phonePattern = /^[0-9]{10}$/; 
  if (!phonePattern.test(phone)) {  alert("Phone number should contain exactly 10 digits.");      document.getElementById("phone").focus();      return 
false;    }
